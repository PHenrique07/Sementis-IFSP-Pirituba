name: Testes do Back-end (Flask/Pytest)

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      # a) Puxa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # b) Configura o Python 3.10
      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # c) Instala as dependências do projeto + pytest
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      # d) Executa a suíte de testes
      - name: Rodar testes com Pytest
        run: pytest --tb=short -v
